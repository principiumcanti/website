worker_processes 1;

events {
  worker_connections 1024;
}

http {
  sendfile on;
  
  upstream jekyll {
    server web:4000;
  }
  
  upstream functions {
    server functions:8888;
  }

  server {
    listen 80;
    
    # Jekyll Static-Website
    location / {
      proxy_pass http://jekyll;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # API-Endpunkte zu Functions-Server weiterleiten
    location /api/ {
      proxy_pass http://functions;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Netlify Functions-Endpunkte zu Functions-Server weiterleiten
    location /.netlify/functions/ {
      proxy_pass http://functions;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}